services:
  mysql:
    image: mysql:8.4
    container_name: pythogorean-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pythogorean
      MYSQL_USER: pythogorean1
      MYSQL_PASSWORD: pythogorean1
      MYSQL_ROOT_PASSWORD: pythogorean-root
    command: --default-time-zone=Asia/Kolkata
    volumes:
      - pythogorean-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppythogorean-root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pythogorean-mysql-data:
